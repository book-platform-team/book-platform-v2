<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أقسام الكتب - مكتبة سامي الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/class.css">
</head>

<body data-page="class">

    <!-- ⬇️ الهيدر + قائمة الجوال + مودال البحث — يركّبهم partials.js -->
    <div id="site-header"></div>


    <!-- ========================================
         📚 قسم أقسام الكتب
         ======================================== -->
    <section class="categories-section">
        <div class="container">

            <div class="categories-title">
                <i class='bx bx-category'></i>
                <h1>أقسام الكتب</h1>
            </div>

            <!-- مربع البحث -->
            <div class="search-container">
                <div class="search-box">
                    <i class='bx bx-search search-icon'></i>
                    <input type="text" id="categorySearchInput" placeholder="البحث عن قسم..." class="search-input">
                    <button class="clear-search" id="clearSearch" style="display: none;">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
            </div>

            <!-- تُملأ من class.js -->
            <div class="categories" id="categoriesContainer"></div>

        </div>
    </section>


    <!-- ⬇️ الفوتر + زر الصعود — يركّبهم partials.js -->
    <div id="site-footer"></div>


    <!-- ⚠️ الترتيب إجباري: api ثم partials ثم ملف الصفحة -->
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/partials.js"></script>
    <script src="/assets/js/class.js"></script>
</body>
</html>
