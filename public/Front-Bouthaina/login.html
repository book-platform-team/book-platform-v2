<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مكتبة سامي الرقمية</title>

    <meta name="description" content="دخول المؤلفين إلى حساباتهم في دار سامي للطباعة والنشر والتوزيع.">
    <link rel="canonical" href="https://sami-library.com/login.html">

    <!-- صفحة حساب — لا تُفهرس -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <meta name="theme-color" content="#7a0c16">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/auth.css">
</head>

<body data-page="login">

    <div id="site-header"></div>


    <section class="auth-page">
        <div class="auth-box">

            <div class="auth-head">
                <i class='bx bx-lock-open-alt'></i>
                <h1>دخول المؤلفين</h1>
                <p>سجّل الدخول لتُملأ بياناتك تلقائياً عند نشر كتابك التالي.</p>
            </div>

            <!-- نموذج الدخول — يُركَّب من auth-ui.js -->
            <div id="loginMount"></div>

            <!-- يظهر بدل النموذج إن كان المؤلف داخلاً أصلاً -->
            <div class="auth-alert ok" id="alreadyIn" hidden>
                <i class='bx bx-check-circle'></i>
                <span>أنت مسجّل الدخول — جارٍ تحويلك...</span>
            </div>

        </div>
    </section>


    <div id="site-footer"></div>

    <!-- ⚠️ الترتيب إجباري: api → auth → auth-ui → partials → ملف الصفحة -->
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/auth-ui.js"></script>
    <script src="/assets/js/partials.js"></script>
    <script src="/assets/js/login.js"></script>
</body>
</html>
