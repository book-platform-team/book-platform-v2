    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/img/favicon.svg">
    <meta name="theme-color" content="#7a0c16">

    <!-- Open Graph — بطاقة المشاركة في واتساب وفيسبوك -->

    <meta property="og:site_name"    content="مكتبة سامي الرقمية">

    <meta property="og:image:height" content="630">

    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="مكتبتي - مكتبة سامي الرقمية">

    <link rel="stylesheet" href="/assets/css/base.css">

</head>

<body data-page="my-library">

    <div id="site-header"></div>


    <!-- ========================================
         📚 ترويسة مكتبتي
         ======================================== -->
    <section class="ml-hero">
        <div class="ml-mesh" aria-hidden="true"></div>

        <div class="wrap">
            <span class="kicker reveal">حسابك</span>
            <h1 class="ml-title reveal" style="--d:.08s">مكتبتي</h1>
            <p class="ml-lead reveal" style="--d:.16s">
                كل ما حفظتِه في مكان واحد — ما تنوين قراءته، وما تقرئينه الآن، وما أنهيتِه.
            </p>
        </div>
    </section>


    <!-- ========================================
         🗂️ الرفوف
         ======================================== -->
    <section class="section">
        <div class="wrap">

            <!-- تبويبات الرفوف -->
            <div class="shelves" id="shelfTabs">
                <button class="shelf-tab active" data-shelf="want_to_read">
                    <i class='bx bx-bookmark'></i>
                    <span>للقراءة لاحقاً</span>
                    <b class="shelf-count" data-count="want_to_read">0</b>
                </button>

                <button class="shelf-tab" data-shelf="reading">
                    <i class='bx bx-book-open'></i>
                    <span>أقرأ حالياً</span>
                    <b class="shelf-count" data-count="reading">0</b>
                </button>

                <button class="shelf-tab" data-shelf="read">
                    <i class='bx bx-check-double'></i>
                    <span>أنهيتُه</span>
                    <b class="shelf-count" data-count="read">0</b>
                </button>

            </div>

            <!-- محتوى الرف -->
            <div class="books-grid" id="shelfBooks"></div>

        </div>
    </section>


    <div id="site-footer"></div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/partials.js"></script>
    <script src="/assets/js/my-library.js"></script>
</body>
</html>
