<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - مكتبة سامي الرقمية</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/profile.css">
</head>

<body data-page="profile">

    <!-- ⬇️ الهيدر + قائمة الجوال + مودال البحث — يركّبهم partials.js -->
    <div id="site-header"></div>


    <!-- قسم الملف الشخصي -->
    <section class="profile-section">
        <div class="container">
            <div class="profile-card">

                <!-- رأس البروفايل -->
                <div class="profile-header">
                    <div class="profile-image-container">
                        <img src="https://placehold.co/150x150/7a0c16/ffffff?text=م" alt="صورة البروفايل" id="profileImage">
                        <label for="uploadImage" class="upload-btn" title="تغيير الصورة">
                            <i class='bx bx-camera'></i>
                        </label>
                        <input type="file" id="uploadImage" accept="image/*" style="display: none;">
                    </div>
                    <div class="profile-info">
                        <h1 id="userName">جارٍ التحميل...</h1>
                        <p class="user-email" id="userEmail">...</p>
                        <div class="role-badge" id="roleBadge">
                            <i class='bx bx-user'></i>
                            <span>قارئ</span>
                        </div>
                    </div>
                </div>

                <!-- نموذج تعديل البيانات -->
                <div class="profile-form">
                    <h2><i class='bx bx-edit'></i> تعديل المعلومات</h2>

                    <div class="form-group">
                        <label for="editName"><i class='bx bx-user'></i> الاسم الكامل</label>
                        <input type="text" id="editName" placeholder="أدخل اسمك">
                    </div>

                    <div class="form-group">
                        <label for="editEmail"><i class='bx bx-envelope'></i> البريد الإلكتروني</label>
                        <input type="email" id="editEmail" placeholder="أدخل بريدك الإلكتروني">
                    </div>

                    <div class="form-group">
                        <label for="editPhone"><i class='bx bx-phone'></i> رقم الهاتف</label>
                        <input type="tel" id="editPhone" placeholder="أدخل رقم هاتفك">
                    </div>

                    <button class="btn-save" id="saveProfileBtn">
                        <i class='bx bx-check'></i> حفظ التغييرات
                    </button>
                </div>

                <!-- تغيير الدور -->
                <div class="role-change-section">
                    <h2><i class='bx bx-refresh'></i> تغيير نوع الحساب</h2>

                    <div class="role-options">
                        <div class="role-option" data-role="reader" id="readerOption">
                            <div class="role-icon"><i class='bx bx-book-reader'></i></div>
                            <h3>قارئ</h3>
                            <p>تصفح الكتب واقرأ بدون نشر</p>
                            <div class="role-status" id="readerStatus">
                                <i class='bx bx-check-circle'></i>
                                <span>حالي</span>
                            </div>
                        </div>

                        <div class="role-option" data-role="author" id="authorOption">
                            <div class="role-icon"><i class='bx bx-pencil'></i></div>
                            <h3>مؤلف</h3>
                            <p>انشر كتبك وشارك معرفتك مع الجميع</p>
                            <div class="role-status" id="authorStatus" style="display: none;">
                                <i class='bx bx-check-circle'></i>
                                <span>حالي</span>
                            </div>
                        </div>
                    </div>

                    <button class="btn-change-role" id="changeRoleBtn" style="display: none;">
                        <i class='bx bx-transfer'></i>
                        <span>التحول إلى مؤلف</span>
                    </button>

                    <div class="role-change-message" id="roleChangeMessage" style="display: none;">
                        <i class='bx bx-info-circle'></i>
                        <p>بعد التحول لمؤلف، ستظهر في قائمة المؤلفين وسيتمكن الآخرون من رؤية كتبك المنشورة.</p>
                    </div>
                </div>

                <!-- الإحصائيات -->
                <div class="user-stats">
                    <div class="stat-item">
                        <i class='bx bx-book'></i>
                        <span id="booksCount">0</span>
                        <p>كتب منشورة</p>
                    </div>
                    <div class="stat-item">
                        <i class='bx bx-star'></i>
                        <span id="avgRating">0.0</span>
                        <p>متوسط التقييم</p>
                    </div>
                    <div class="stat-item">
                        <i class='bx bx-eye'></i>
                        <span id="viewsCount">0</span>
                        <p>مشاهدة</p>
                    </div>
                </div>

            </div>
        </div>
    </section>


    <!-- ⬇️ الفوتر + زر الصعود — يركّبهم partials.js -->
    <div id="site-footer"></div>


    <!-- ⚠️ الترتيب إجباري: api ثم partials ثم ملف الصفحة -->
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/partials.js"></script>
    <script src="/assets/js/profile.js"></script>
</body>
</html>
