<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المؤلفون - مكتبة سامي الرقمية</title>


    <meta name="description" content="تعرّفي على مؤلفي دار سامي وكتبهم المنشورة في المكتبة الرقمية.">
    <link rel="canonical" href="https://sami-library.com/author.html">

    <!-- الأيقونة -->
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/img/favicon.svg">
    <meta name="theme-color" content="#7a0c16">

    <!-- Open Graph — بطاقة المشاركة في واتساب وفيسبوك -->
    <meta property="og:type"         content="website">
    <meta property="og:site_name"    content="مكتبة سامي الرقمية">
    <meta property="og:locale"       content="ar_DZ">
    <meta property="og:url"          content="https://sami-library.com/author.html">
    <meta property="og:title"        content="المؤلفون - مكتبة سامي الرقمية">
    <meta property="og:description"  content="تعرّفي على مؤلفي دار سامي وكتبهم المنشورة في المكتبة الرقمية.">
    <meta property="og:image"        content="https://sami-library.com/assets/img/og-default.png">
    <meta property="og:image:width"  content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt"    content="مكتبة سامي الرقمية">

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="المؤلفون - مكتبة سامي الرقمية">
    <meta name="twitter:description" content="تعرّفي على مؤلفي دار سامي وكتبهم المنشورة في المكتبة الرقمية.">
    <meta name="twitter:image"       content="https://sami-library.com/assets/img/og-default.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/author.css">
</head>

<body data-page="author">

    <!-- ⬇️ الهيدر + قائمة الجوال + مودال البحث — يركّبهم partials.js -->
    <div id="site-header"></div>


    <!-- قسم المؤلفون -->
    <section class="authors-section">
        <div class="container">

            <div class="authors-title">
                <i class='bx bx-user'></i>
                <h1>المؤلفون</h1>
            </div>

            <!-- مربع البحث -->
            <div class="search-container">
                <div class="search-box">
                    <i class='bx bx-search search-icon'></i>
                    <input type="text" id="authorSearchInput" placeholder="البحث عن مؤلف..." class="search-input">
                    <button class="clear-search" id="clearSearch" style="display: none;">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
            </div>

            <!-- شبكة المؤلفين — تُملأ من author.js -->
            <div class="authors-grid" id="authorsGrid">
                <div class="loading-authors">
                    <i class='bx bx-loader-alt bx-spin'></i>
                    <p>جارٍ تحميل المؤلفين...</p>
                </div>
            </div>

            <!-- لا نتائج للبحث -->
            <div class="no-results" id="noResults" style="display: none;">
                <i class='bx bx-search-alt'></i>
                <p>لم يتم العثور على نتائج</p>
            </div>

            <!-- لا مؤلفين -->
            <div class="no-authors" id="noAuthors" style="display: none;">
                <i class='bx bx-user-x'></i>
                <p>لا يوجد مؤلفون مسجلون حالياً</p>
                <a href="/register.html" class="btn-become-author">كن أول مؤلف</a>
            </div>

        </div>
    </section>


    <!-- ⬇️ الفوتر + زر الصعود — يركّبهم partials.js -->
    <div id="site-footer"></div>


    <!-- ⚠️ الترتيب إجباري: api ثم partials ثم ملف الصفحة -->
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/partials.js"></script>
    <script src="/assets/js/author.js"></script>
</body>
</html>
