<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المؤلفون - مكتبة سامي الرقمية</title>

    <meta name="description" content="تعرّف على مؤلفي دار سامي وكتبهم المنشورة في المكتبة الرقمية.">
    <link rel="canonical" href="https://sami-library.com/author.html">

    <!-- الأيقونة -->
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/img/favicon.svg">
    <meta name="theme-color" content="#7a0c16">

    <!-- Open Graph — بطاقة المشاركة في واتساب وفيسبوك -->
    <meta property="og:type"         content="website">
    <meta property="og:site_name"    content="مكتبة سامي الرقمية">
    <meta property="og:locale"       content="ar_DZ">
    <meta property="og:url"          content="https://sami-library.com/author.html">
    <meta property="og:title"        content="المؤلفون - مكتبة سامي الرقمية">
    <meta property="og:description"  content="تعرّف على مؤلفي دار سامي وكتبهم المنشورة في المكتبة الرقمية.">
    <meta property="og:image"        content="https://sami-library.com/assets/img/og-default.png">
    <meta property="og:image:width"  content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt"    content="مكتبة سامي الرقمية">

    <!-- Twitter -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="المؤلفون - مكتبة سامي الرقمية">
    <meta name="twitter:description" content="تعرّف على مؤلفي دار سامي وكتبهم المنشورة في المكتبة الرقمية.">
    <meta name="twitter:image"       content="https://sami-library.com/assets/img/og-default.png">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/author.css">
</head>

<body data-page="author">

    <!-- ⬇️ الهيدر + قائمة الجوال + مودال البحث — يركّبهم partials.js -->
    <div id="site-header"></div>


    <!-- ========================================
         ✍️ ترويسة الصفحة
         ======================================== -->
    <header class="au-hero">
        <div class="wrap">
            <span class="au-kicker">دار سامي للطباعة والنشر والتوزيع</span>
            <h1>المؤلفون</h1>
            <p>الأسماء التي صنعت هذه المكتبة — من نشر معنا، ومن نُعيد نشر أعماله.</p>
        </div>
    </header>


    <section class="section au-section">
        <div class="wrap">

            <!-- ---------- البحث ---------- -->
            <div class="au-tools">
                <div class="au-search">
                    <i class='bx bx-search'></i>
                    <input type="search" id="authorSearchInput"
                           placeholder="ابحث باسم المؤلف..."
                           autocomplete="off" aria-label="البحث عن مؤلف">
                    <button type="button" class="au-clear" id="clearSearch" hidden aria-label="مسح البحث">
                        <i class='bx bx-x'></i>
                    </button>
                </div>

                <p class="au-count" id="authorsCount" hidden></p>
            </div>


            <!-- ---------- الشبكة ---------- -->
            <div class="au-grid" id="authorsGrid"></div>


            <!-- ---------- لا نتائج للبحث ---------- -->
            <div class="au-empty" id="noResults" hidden>
                <i class='bx bx-search-alt'></i>
                <b>لم نجد مؤلفاً بهذا الاسم</b>
                <span>جرّب اسماً آخر، أو امسح البحث لرؤية الجميع.</span>
            </div>


            <!-- ---------- لا مؤلفين ---------- -->
            <div class="au-empty" id="noAuthors" hidden>
                <i class='bx bx-user-plus'></i>
                <b>لا يوجد مؤلفون بعد</b>
                <span>كن أول من ينشر كتابه في المكتبة.</span>
                <a href="/upload-book.html" class="au-cta">
                    <i class='bx bx-upload'></i> انشر كتابك
                </a>
            </div>


            <!-- ---------- خطأ ---------- -->
            <div class="au-empty err" id="loadError" hidden>
                <i class='bx bx-error-circle'></i>
                <b>تعذّر تحميل المؤلفين</b>
                <span>تحقّق من اتصالك ثم أعد المحاولة.</span>
                <button type="button" class="au-cta ghost" id="retryBtn">
                    <i class='bx bx-refresh'></i> إعادة المحاولة
                </button>
            </div>

        </div>
    </section>


    <!-- ⬇️ الفوتر + زر الصعود — يركّبهم partials.js -->
    <div id="site-footer"></div>


    <!-- ⚠️ الترتيب إجباري: api ثم partials ثم ملف الصفحة -->
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/partials.js"></script>
    <script src="/assets/js/author.js"></script>
</body>
</html>
