<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | مكتبة سامي الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <main>
        <div class="bg-overlay"></div>
        <div class="login-card">
            <div class="logo">
                <img src="ThePhoto/IMG_5433 (1).png" alt="شعار سامي" class="logo-image">
                <h2>إنشاء حساب</h2>
                <p>مرحباً بك في مكتبة سامي الرقمية</p>
            </div>

            <form id="registerForm">
                <!-- الاسم -->
                <div class="input-group">
                    <input type="text" id="name" placeholder="الاسم" required>
                </div>

                <!-- البريد / الهاتف -->
                <div class="contact-input-wrapper">
                    <div id="emailContainer" class="input-box">
                        <input type="email" id="emailInput" placeholder="البريد الإلكتروني" required>
                        <span class="toggle-link" id="phoneToggle">هاتف</span>
                    </div>
                    <div id="phoneContainer" class="input-box" style="display:none;">
                        <select id="countryCode" class="country-code">
                            <option value="+213">🇩🇿 الجزائر (+213)</option>
                            <option value="+966">🇸🇦 السعودية (+966)</option>
                            <option value="+971">🇦🇪 الإمارات (+971)</option>
                            <option value="+20">🇪🇬 مصر (+20)</option>
                        </select>
                        <input type="tel" id="phoneInput" placeholder="رقم الهاتف" dir="ltr">
                        <span class="toggle-link" id="emailToggle">بريد</span>
                    </div>
                </div>

                <!-- تاريخ الميلاد -->
                <div class="input-group birthdate">
                    <select id="birthDay" required>
                        <option value="">يوم</option>
                        <script>
                            for(let i=1; i<=31; i++){
                                document.write(`<option value="${i}">${i}</option>`);
                            }
                        </script>
                    </select>
                    <select id="birthMonth" required>
                        <option value="">شهر</option>
                        <option value="يناير">يناير</option>
                        <option value="فبراير">فبراير</option>
                        <option value="مارس">مارس</option>
                        <option value="أبريل">أبريل</option>
                        <option value="مايو">مايو</option>
                        <option value="يونيو">يونيو</option>
                        <option value="يوليو">يوليو</option>
                        <option value="أغسطس">أغسطس</option>
                        <option value="سبتمبر">سبتمبر</option>
                        <option value="أكتوبر">أكتوبر</option>
                        <option value="نوفمبر">نوفمبر</option>
                        <option value="ديسمبر">ديسمبر</option>
                    </select>
                    <select id="birthYear" required>
                        <option value="">سنة</option>
                        <script>
                            const currentYear = new Date().getFullYear();
                            for(let y = currentYear; y >= 1950; y--){
                                document.write(`<option value="${y}">${y}</option>`);
                            }
                        </script>
                    </select>
                </div>

                <!-- النوع -->
                <div class="input-group">
                    <select id="gender" required>
                        <option value="">اختر النوع</option>
                        <option value="male">ذكر</option>
                        <option value="female">أنثى</option>
                    </select>
                </div>

                <!-- كلمة المرور -->
                <div class="input-group password-box">
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                    <span class="toggle-pass" id="togglePassBtn">إظهار</span>
                </div>

                <!-- تأكيد كلمة المرور -->
                <div class="input-group password-box">
                    <input type="password" id="passwordConfirm" placeholder="تأكيد كلمة المرور" required>
                </div>

                <button type="submit" class="btn-primary">إنشاء حساب</button>

                <div class="or-divider">أو</div>

                <!-- أزرار تسجيل الدخول الاجتماعي -->
                

                <div class="links">
                    <p>لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer">
            <p>
                حقوق الملكية © 2026 |
                <a href="#">إتفاقية الإستخدام</a> |
                <a href="#">سياسة الخصوصية</a> |
                <a href="#">عن المكتبة</a> |
                <a href="#">أتصل بنا</a>
            </p>
        </div>
    </footer>

    <script src="register.js"></script>
</body>
</html>
