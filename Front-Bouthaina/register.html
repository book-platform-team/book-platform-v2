<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | مكتبة سامي الرقمية</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="register.css">
</head>

<body>

<main>
<div class="bg-overlay"></div>

<div class="login-card">

<div class="logo">
<h1 class="brand">سامي</h1>
<h2>إنشاء حساب</h2>
<p>مرحباً بك في مكتبة سامي الرقمية</p>
</div>

<form id="registerForm">

<!-- الاسم -->
<div class="input-group">
<input type="text" id="name" placeholder="الاسم" required>
</div>


<!-- البريد / الهاتف -->

<div class="contact-input-wrapper">

<div id="emailContainer" class="input-box">
<input type="email" id="emailInput" placeholder="البريد الإلكتروني" required>
<span class="toggle-link" onclick="switchToPhone()">هاتف</span>
</div>

<div id="phoneContainer" class="input-box" style="display:none;">

<select id="countryCode" class="country-code">
<option value="+213">🇩🇿 الجزائر (+213)</option>
<option value="+966">🇸🇦 السعودية (+966)</option>
<option value="+971">🇦 الإمارات (+971)</option>
<option value="+20">🇪🇬 مصر (+20)</option>
</select>

<input type="tel" id="phoneInput" placeholder="رقم الهاتف" dir="ltr">
<span class="toggle-link" onclick="switchToEmail()">بريد</span>

</div>

</div>


<!-- تاريخ الميلاد -->

<div class="input-group birthdate">

<select id="birthDay" required>
<option value="">يوم الميلاد</option>
<script>
for(let i=1;i<=31;i++){
document.write('<option>'+i+'</option>');
}
</script>
</select>

<select id="birthMonth" required>
<option value="">شهر الميلاد</option>
<script>
const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
months.forEach(m=>{
document.write('<option>'+m+'</option>');
});
</script>
</select>

<select id="birthYear" required>
<option value="">سنة الميلاد</option>
<script>
for(let y=2026;y>=1900;y--){
document.write('<option>'+y+'</option>');
}
</script>
</select>

</div>


<!-- النوع -->

<div class="input-group">
<select id="gender" required>
<option value="">اختر النوع</option>
<option value="male">ذكر</option>
<option value="female">أنثى</option>
</select>
</div>


<!-- كلمة المرور -->

<div class="input-group password-box">
<input type="password" id="password" placeholder="كلمة المرور" required>
<span class="toggle-pass" id="togglePassBtn">إظهار</span>
</div>


<!-- تأكيد كلمة المرور -->

<div class="input-group password-box">
<input type="password" id="passwordConfirm" placeholder="تأكيد كلمة المرور" required>
</div>





<button type="submit" class="btn-primary">إنشاء حساب</button>


          <div class="or-divider">أو</div>

          <div class="links">
              <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
          </div>

          <div class="or-divider">أو</div>

          <div class="social-buttons">
              <button type="button" class="btn-google">جوجل</button>
              <button type="button" class="btn-facebook">فيسبوك</button>
          </div>

      </form> <!-- ✅ إغلاق الفورم هنا -->
  </div>
</main>

<footer>
  <div class="footer">
    <p>
      حقوق الملكية © 2026 |
      <a href="#">إتفاقية الإستخدام</a> |
      <a href="#">سياسة الخصوصية</a> |
      <a href="#">عن المكتبة</a> |
      <a href="#">أتصل بنا</a>
    </p>
  </div>
</footer>
</form>

</div>
</main>


<script src="register.js"></script>

</body>
</html>
