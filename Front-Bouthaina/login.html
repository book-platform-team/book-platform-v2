<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | مكتبة سامي الرقمية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>

<main>
  <div class="bg-overlay"></div>

  <div class="login-card">
      <div class="logo">
          <h1 class="brand">سامي</h1>
          <h2>تسجيل الدخول</h2>
          <p>مرحباً بك في مكتبة سامي الرقمية</p>
      </div>

      <!-- فورم واحد فقط ✅ -->
      <form id="loginForm">

          <!-- البريد الإلكتروني / الهاتف المدمج -->
          <div class="input-group">
              <div class="contact-input-wrapper">
                  
                  <!-- حقل البريد -->
                  <div id="emailContainer" class="input-box">
                      <input type="email" id="emailInput" name="contact" placeholder="البريد الإلكتروني" required>
                      <span class="toggle-link" onclick="switchToPhone(event)">هاتف</span>
                  </div>
                  
                  <!-- حقل الهاتف -->
                  <div id="phoneContainer" class="input-box" style="display:none;">
                      <select id="countryCode" name="country" class="country-code">
                          <option value="+213">🇩🇿 +213</option>
                          <option value="+966">🇸🇦 +966</option>
                          <option value="+971">🇦🇪 +971</option>
                          <option value="+20">🇪🇬 +20</option>
                          <option value="+212">🇲🇦 +212</option>
                          <option value="+216">🇹🇳 +216</option>
                          <option value="+218">🇱🇾 +218</option>
                          <option value="+963">🇸🇾 +963</option>
                          <option value="+964">🇮🇶 +964</option>
                          <option value="+965">🇰🇼 +965</option>
                          <option value="+974">🇶🇦 +974</option>
                          <option value="+973">🇧🇭 +973</option>
                          <option value="+968">🇴🇲 +968</option>
                          <option value="+962">🇯🇴 +962</option>
                          <option value="+961">🇱🇧 +961</option>
                          <option value="+1">🇺🇸 +1</option>
                          <option value="+44">🇬🇧 +44</option>
                          <option value="+33">🇫🇷 +33</option>
                          <option value="+49">🇩🇪 +49</option>
                      </select>
                      <input type="tel" id="phoneInput" name="contact" placeholder="رقم الهاتف" dir="ltr">
                      <span class="toggle-link" onclick="switchToEmail(event)">بريد</span>
                  </div>
              </div>
          </div>

              <!-- حقل كلمة المرور -->
<div class="input-group password-box">
    <input type="password" id="password" placeholder="كلمة المرور" required>
    
    <!-- زر التبديل مع id عشان نتحكم فيه -->
    <span class="toggle-pass" id="togglePassBtn" onclick="togglePassword()">إظهار</span>
</div>

          <!-- نسيت كلمة المرور -->
          <div class="forgot">
              <a href="#">نسيت كلمة المرور؟</a>
          </div>

          <!-- زر الدخول -->
          <button type="submit" class="btn-primary">تسجيل الدخول</button>

          <div class="or-divider">أو</div>

          <div class="links">
              <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
          </div>

          <div class="or-divider">أو</div>

          <div class="social-buttons">
              <button type="button" class="btn-google">جوجل</button>
              <button type="button" class="btn-facebook">فيسبوك</button>
          </div>

      </form> <!-- ✅ إغلاق الفورم هنا -->
  </div>
</main>

<footer>
  <div class="footer">
    <p>
      حقوق الملكية © 2026 |
      <a href="#">إتفاقية الإستخدام</a> |
      <a href="#">سياسة الخصوصية</a> |
      <a href="#">عن المكتبة</a> |
      <a href="#">أتصل بنا</a>
    </p>
  </div>
</footer>

<script src="login.js"></script>
</body>
</html>
