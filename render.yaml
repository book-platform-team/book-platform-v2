services:
  - type: web
    name: book-platform
    runtime: php:8.2          # ← مهم جداً: إصدار محدد (ليس "php" فقط)
    region: frankfurt
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: book-platform-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: book-platform-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: book-platform-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: book-platform-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: book-platform-db
          property: password

databases:
  - name: book-platform-db
    databaseName: book_platform
    user: book_platform_user
    plan: free